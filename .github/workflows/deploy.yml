name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # SSH keepalives — without these, the GHA runner's TCP stack
        # eventually drops the connection on long-running setup.sh
        # runs (e.g. a zet -i reindex, which can run for 10+ min and
        # produced a "broken pipe" mid-build on 2026-06-05).
        # ServerAliveInterval=30 + ServerAliveCountMax=120 = ~60 min
        # of silence before the client gives up, easily covering any
        # current setup.sh step.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              -o TCPKeepAlive=yes \
              deploy@${{ secrets.VPS_IP }} \
              "bash /opt/zettair-search/deploy/deploy.sh"